<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stabilni AR</title>
    <!-- Načtení moderního 3D vykreslovače od Googlu, který se nehroutí a netřese -->
    <script type="module" src="https://googleapis.com"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
        model-viewer { width: 100%; height: 100%; background-color: #111; }
    </style>
</head>
<body>

    <!-- Kód si sám najde tvůj model asset.glb ve složce assets -->
    <!-- auto-rotate automaticky vynutí rotaci, pokud by ta z Blenderu zlobila -->
    <model-viewer src="assets/asset.glb" 
                  ar 
                  ar-modes="webxr scene-viewer quick-look" 
                  camera-controls 
                  auto-rotate 
                  shadow-intensity="1">
    </model-viewer>

</body>
</html>
