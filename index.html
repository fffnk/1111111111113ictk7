<!doctype html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
        
        <script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>
        <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@master/aframe/build/aframe-ar.js"></script>
        <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@master/dist/aframe-extras.loaders.min.js"></script>
        <script src="https://cdn.jsdelivr.net/gh/AR-js-org/studio-backend@master/src/modules/marker/tools/gesture-detector.js"></script>
        <script src="https://cdn.jsdelivr.net/gh/AR-js-org/studio-backend@master/src/modules/marker/tools/gesture-handler.js"></script>

        <!-- AGRESIVNÍ DEADZONE FILTR -->
        <script>
            AFRAME.registerComponent('stabilizer', {
                schema: {
                    marker: {type: 'selector'},
                    speed: {type: 'number', default: 0.1}, // Rychlost dohánění
                    threshold: {type: 'number', default: 0.02} // Mrtvá zóna - vše pod tuto hodnotu se ignoruje
                },
                init: function () {
                    this.markerObj = this.data.marker.object3D;
                    this.el.object3D.visible = false;
                },
                tick: function () {
                    if (this.markerObj && this.markerObj.visible) {
                        if (!this.el.object3D.visible) {
                            this.el.object3D.position.copy(this.markerObj.position);
                            this.el.object3D.quaternion.copy(this.markerObj.quaternion);
                            this.el.object3D.visible = true;
                        }
                        
                        // Vypočítáme, jak moc se marker od minula pohnul
                        var distance = this.el.object3D.position.distanceTo(this.markerObj.position);
                        var angle = this.el.object3D.quaternion.angleTo(this.markerObj.quaternion);

                        // Model se pohne POUZE tehdy, pokud je pohyb větší než náš threshold (odstraní mikrotřes)
                        if (distance > this.data.threshold) {
                            this.el.object3D.position.lerp(this.markerObj.position, this.data.speed);
                        }
                        if (angle > this.data.threshold) {
                            this.el.object3D.quaternion.slerp(this.markerObj.quaternion, this.data.speed);
                        }
                    } else {
                        this.el.object3D.visible = false;
                    }
                }
            });
        </script>
    </head>

    <body style="margin: 0; overflow: hidden;">
        <a-scene
            vr-mode-ui="enabled: false;"
            loading-screen="enabled: false;"
            renderer="logarithmicDepthBuffer: true;"
            arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;"
            id="scene"
            embedded
            gesture-detector
        >
            <a-assets>
                <a-asset-item id="animated-asset" src="assets/asset.glb"></a-asset-item>
            </a-assets>

            <a-marker
                id="animated-marker"
                type="pattern"
                preset="custom"
                url="assets/marker.patt"
                raycaster="objects: .clickable"
                emitevents="true"
                cursor="fuse: false; rayOrigin: mouse;"
            >
            </a-marker>

            <!-- Zde je napojený náš nový filtr. Můžeš ladit threshold (0.01 - 0.05). Čím vyšší číslo, tím víc bude model přibitý na místě (ale může skákat při větším pohybu) -->
            <a-entity stabilizer="marker: #animated-marker; speed: 0.1; threshold: 0.02">
                <a-entity
                    id="bowser-model"
                    scale="1 1 1"
                    animation-mixer="loop: repeat"
                    gltf-model="#animated-asset"
                    class="clickable"
                    gesture-handler
                ></a-entity>
            </a-entity>

            <a-entity camera></a-entity>
        </a-scene>
    </body>
</html>
