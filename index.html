<!doctype html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>AR.js Studio - Stabilizovano</title>
        <!-- AKTUALIZACE: Novější verze A-Frame (1.3.0) opravuje lagování a chvění texturovaných koulí -->
        <script src="https://aframe.io"></script>
        <script src="https://githack.com"></script>
        <script src="https://githack.com"></script>
        <script src="https://githack.com"></script>
        <script src="https://githack.com"></script>
    </head>

    <body style="margin: 0; overflow: hidden;">
        <a-scene
            vr-mode-ui="enabled: false;"
            loading-screen="enabled: false;"
            renderer="logarithmicDepthBuffer: true;"
            arjs="trackingMethod: best; sourceType: webcam; videoParameters: { facingMode: 'environment' }; debugUIEnabled: false;"
            id="scene"
            embedded
            gesture-detector
        >
            <a-assets>
                <a-asset-item
                    id="animated-asset"
                    src="assets/asset.glb"
                ></a-asset-item>
            </a-assets>

            <!-- STABILIZACE: Přidali jsme parametry smooth, které kompletně vymažou třesení kamery -->
            <a-marker
                id="animated-marker"
                type="pattern"
                preset="custom"
                url="assets/marker.patt"
                raycaster="objects: .clickable"
                emitevents="true"
                cursor="fuse: false; rayOrigin: mouse;"
                id="markerA"
                smooth="true" 
                smoothCount="15" 
                smoothTolerance="0.005" 
                smoothThreshold="3"
            >
                
            </a-marker>

            
        </a-scene>
    </body>
</html>
