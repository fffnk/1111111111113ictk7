<!doctype html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>AR.js Studio - Opraveno Bez Chyb</title>
        
        <!-- OPRAVA: Používáme oficiální stabilní servery, které mobil nezablokuje -->
        <script src="https://aframe.io"></script>
        <script src="https://jsdelivr.net"></script>
        <script src="https://jsdelivr.net"></script>
        
        <!-- Oficiální stabilní skripty pro gesta přímo z ověřeného CDN -->
        <script src="https://jsdelivr.net"></script>
        <script src="https://jsdelivr.net"></script>
    </head>

    <body style="margin: 0; overflow: hidden;">
        <a-scene
            vr-mode-ui="enabled: false;"
            loading-screen="enabled: false;"
            renderer="logarithmicDepthBuffer: true;"
            arjs="trackingMethod: best; sourceType: webcam; videoParameters: { facingMode: 'environment' }; debugUIEnabled: false;"
            id="scene"
            embedded
            gesture-detector
        >
            <a-assets>
                <a-asset-item
                    id="animated-asset"
                    src="assets/asset.glb"
                ></a-asset-item>
            </a-assets>

            <!-- Stabilizační filtry smooth nastavené na rozumný střed, aby to netancovalo a mobil to upočítal -->
            <a-marker
                id="animated-marker"
                type="pattern"
                preset="custom"
                url="assets/marker.patt"
                raycaster="objects: .clickable"
                emitevents="true"
                cursor="fuse: false; rayOrigin: mouse;"
                smooth="true" 
                smoothCount="12" 
                smoothTolerance="0.005" 
                smoothThreshold="3"
            >
                
            </a-marker>

            
        </a-scene>
    </body>
</html>
