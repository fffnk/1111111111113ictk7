<!doctype html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>AR.js Studio - Stabilní Verze</title>
        <!-- Použití prověřené stabilní verze enginu -->
        <script src="https://aframe.io"></script>
        <script src="https://githack.com"></script>
        <!-- Skript pro spuštění rotace z Blenderu -->
        <script src="https://jsdelivr.net"></script>
    </head>

    <body style="margin: 0; overflow: hidden;">
        <a-scene
            vr-mode-ui="enabled: false;"
            loading-screen="enabled: false;"
            renderer="logarithmicDepthBuffer: true;"
            arjs="trackingMethod: best; sourceType: webcam; videoParameters: { facingMode: 'environment' }; debugUIEnabled: false;"
            id="scene"
            embedded
        >
            <a-assets>
                <a-asset-item
                    id="animated-asset"
                    src="assets/asset.glb"
                ></a-asset-item>
            </a-assets>

            <!-- NÁVRAT K FUNKČNÍMU STABILNÍMU FILTRU: SmoothCount na 12 a normální tolerance -->
            <!-- Tohle telefon bezpečně přelouská, bílá tma zmizí a chvění se utlumí -->
            <a-marker
                id="animated-marker"
                type="pattern"
                preset="custom"
                url="assets/marker.patt"
                smooth="true" 
                smoothCount="12" 
                smoothTolerance="0.005" 
                smoothThreshold="3"
            >
                
            </a-marker>

            
        </a-scene>
    </body>
</html>
