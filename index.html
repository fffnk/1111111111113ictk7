<!doctype html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>AR.js Studio - Navrat k funkcnimu</title>
        <!-- Prověřené verze, se kterými ti kamera prokazatelně naběhla -->
        <script src="https://aframe.io"></script>
        <script src="https://githack.com"></script>
        <script src="https://jsdelivr.net"></script>
    </head>

    <body style="margin: 0; overflow: hidden;">
        <a-scene
            vr-mode-ui="enabled: false;"
            loading-screen="enabled: false;"
            renderer="logarithmicDepthBuffer: true; antialias: true;"
            arjs="trackingMethod: best; sourceType: webcam; videoParameters: { facingMode: 'environment' }; debugUIEnabled: false;"
            id="scene"
            embedded
        >
            <a-assets>
                <a-asset-item
                    id="animated-asset"
                    src="assets/asset.glb"
                ></a-asset-item>
            </a-assets>

            <!-- OPRAVENO: Vyhlazování nastavené přímo přes parametry AR.js scény -->
            <!-- Smazali jsme ty problematické doplňky na gesta, co to sekaly -->
            <a-marker
                id="animated-marker"
                type="pattern"
                preset="custom"
                url="assets/marker.patt"
                smooth="true" 
                smoothCount="10" 
                smoothTolerance="0.01" 
                smoothThreshold="5"
            >
                
            </a-marker>

            
        </a-scene>
    </body>
</html>
